{% extends 'base.html' %}
{% block content %}

<h2>Available Jobs</h2>

{% for job in jobs %}
<div class="card mb-3">
    <div class="card-body">
        <h4>{{ job.title }}</h4>
        <p>{{ job.company }} - {{ job.location }}</p>
        <a class="btn btn-primary" href="{% url 'job_detail' job.id %}">View</a>
    </div>
</div>
{% empty %}
<p>No jobs posted yet.</p>
{% endfor %}

{% endblock %}
